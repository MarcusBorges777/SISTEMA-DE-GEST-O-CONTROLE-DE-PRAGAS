<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestao - Dedetizadora Borges</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
            colors: {
              brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#254191', 600: '#1e3575', 700: '#172a5c', 800: '#111f44', 900: '#0b152e' },
            },
            animation: {
              'modal-in':    'modalIn 0.22s cubic-bezier(0.16,1,0.3,1) both',
              'modal-out':   'modalOut 0.15s ease-in both',
              'backdrop-in': 'backdropIn 0.2s ease-out both',
              'slide-in':    'slideIn 0.3s cubic-bezier(0.16,1,0.3,1) both',
              'slide-up':    'slideUp 0.25s cubic-bezier(0.16,1,0.3,1) both',
              'fade-in':     'fadeIn 0.2s ease-out both',
              'scale-in':    'scaleIn 0.18s cubic-bezier(0.16,1,0.3,1) both',
              'pulse-slow':  'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
            },
            keyframes: {
              modalIn:    { '0%': { opacity:'0', transform:'scale(0.95) translateY(8px)' }, '100%': { opacity:'1', transform:'scale(1) translateY(0)' } },
              modalOut:   { '0%': { opacity:'1', transform:'scale(1) translateY(0)' },       '100%': { opacity:'0', transform:'scale(0.96) translateY(4px)' } },
              backdropIn: { '0%': { opacity:'0' }, '100%': { opacity:'1' } },
              slideIn:    { '0%': { transform:'translateX(100%)', opacity:'0' }, '100%': { transform:'translateX(0)', opacity:'1' } },
              slideUp:    { '0%': { transform:'translateY(12px)', opacity:'0' }, '100%': { transform:'translateY(0)', opacity:'1' } },
              fadeIn:     { '0%': { opacity:'0' }, '100%': { opacity:'1' } },
              scaleIn:    { '0%': { opacity:'0', transform:'scale(0.92)' }, '100%': { opacity:'1', transform:'scale(1)' } },
            },
            boxShadow: {
              'brand-sm': '0 1px 3px 0 rgb(37 65 145 / 0.15)',
              'brand-md': '0 4px 12px 0 rgb(37 65 145 / 0.2)',
              'brand-lg': '0 8px 24px 0 rgb(37 65 145 / 0.25)',
            },
            transitionTimingFunction: {
              'spring': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
          },
        },
      }
    </script>
    <style>
        body { font-family: Inter, system-ui, -apple-system, sans-serif; }

        /* Transição suave de tema — apenas propriedades visuais, não layout */
        *, *::before, *::after {
          transition-property: background-color, border-color, color, fill, stroke;
          transition-timing-function: ease;
          transition-duration: 0.15s;
        }
        /* Não transicionar transform/opacity para não interferir com animações */
        *:where([class*="animate-"]) { transition: none !important; }

        /* Focus ring global para acessibilidade — substituindo outline:none */
        :focus-visible {
          outline: 2px solid #254191;
          outline-offset: 2px;
          border-radius: 6px;
        }
        /* Remover outline padrão apenas para mouse (não teclado) */
        :focus:not(:focus-visible) { outline: none; }

        @page { size: A4; margin: 0; }
        @media print {
            body { background: white !important; margin: 0; padding: 0; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
                transition: none !important;
            }
            .no-print, .print\\:hidden { display: none !important; }
            .a4-page {
                box-shadow: none !important; border: none !important; margin: 0 !important;
                padding: 15mm !important; width: 210mm; min-height: 297mm; overflow: hidden;
                page-break-inside: avoid;
            }
            .print-page-break { page-break-before: always; }
            .print-bg-blue { background-color: #254191 !important; color: white !important; }
            .print-bg-header { background-color: #1e3a8a !important; color: white !important; }
            .print-bg-blue-line { background-color: #254191 !important; }
            .print-bg-light-blue { background-color: #eff6ff !important; }
            .print-bg-red { background-color: #fff5f5 !important; }
            .print-avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; }
        }
        .no-spinner::-webkit-inner-spin-button, .no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        textarea { overflow: hidden; resize: none; }

        /* Scrollbar global refinada */
        * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        *::-webkit-scrollbar { width: 5px; height: 5px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark *::-webkit-scrollbar-thumb { background: #334155; }
        .dark *::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Utilitários de animação compostos */
        .animate-enter { animation: slideUp 0.25s cubic-bezier(0.16,1,0.3,1) both; }
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
  <script type="module" crossorigin src="/static/dist/assets/main.js"></script>
  <link rel="modulepreload" crossorigin href="/static/dist/assets/react.js">
  <link rel="modulepreload" crossorigin href="/static/dist/assets/pdf.js">
  <link rel="modulepreload" crossorigin href="/static/dist/assets/icons.js">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
</body>
</html>
