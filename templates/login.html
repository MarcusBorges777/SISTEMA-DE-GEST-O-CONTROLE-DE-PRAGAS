<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <div class="glass-effect rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-6">

        <!-- Logo e Título -->
        <div class="text-center">
            <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Bem-vindo de volta!</h1>
            <p class="text-gray-600 mt-2">Faça login para continuar</p>
        </div>

        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="rounded-lg p-4 {% if category == 'error' or category == 'danger' %}bg-red-50 text-red-800 border border-red-200{% elif category == 'success' %}bg-green-50 text-green-800 border border-green-200{% elif category == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200{% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
                        <div class="flex items-center">
                            <i data-lucide="{% if category == 'error' or category == 'danger' %}alert-circle{% elif category == 'success' %}check-circle{% elif category == 'warning' %}alert-triangle{% else %}info{% endif %}" class="w-5 h-5 mr-2"></i>
                            <span>{{ message }}</span>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulário de Login -->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5">

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    <i data-lucide="mail" class="w-4 h-4 inline mr-1"></i>
                    Email
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus transition-all outline-none"
                    placeholder="seu@email.com"
                >
            </div>

            <!-- Senha -->
            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-2">
                    <i data-lucide="lock" class="w-4 h-4 inline mr-1"></i>
                    Senha
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus transition-all outline-none pr-12"
                        placeholder="••••••••"
                    >
                    <button
                        type="button"
                        onclick="toggleSenha()"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                    >
                        <i data-lucide="eye" id="toggle-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Lembrar-me e Esqueci a senha -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" name="lembrar" class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500">
                    <span class="ml-2 text-gray-700">Lembrar-me</span>
                </label>
                <a href="{{ url_for('recuperar_senha') }}" class="text-purple-600 hover:text-purple-700 font-medium">
                    Esqueceu a senha?
                </a>
            </div>

            <!-- Botão Login -->
            <button
                type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-indigo-700 transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-xl"
            >
                <i data-lucide="log-in" class="w-5 h-5 inline mr-2"></i>
                Entrar
            </button>
        </form>

        <!-- Divider -->
        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white text-gray-500">Novo por aqui?</span>
            </div>
        </div>

        <!-- Link para Registro -->
        <a
            href="{{ url_for('registrar') }}"
            class="block w-full text-center py-3 border-2 border-purple-600 text-purple-600 rounded-lg font-semibold hover:bg-purple-50 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
        >
            <i data-lucide="user-plus" class="w-5 h-5 inline mr-2"></i>
            Criar uma conta
        </a>

    </div>

    <!-- Scripts -->
    <script>
        // Inicializar ícones Lucide
        lucide.createIcons();

        // Toggle mostrar/ocultar senha
        function toggleSenha() {
            const senhaInput = document.getElementById('senha');
            const toggleIcon = document.getElementById('toggle-icon');

            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                senhaInput.type = 'password';
                toggleIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Auto-focus no email ao carregar
        document.getElementById('email').focus();
    </script>

</body>
</html>
