<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestao - Dedetizadora Borges</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: Inter, system-ui, -apple-system, sans-serif; margin: 0; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    {% if config.get('ENV') == 'development' or config.get('FLASK_ENV') == 'development' %}
    <script>
        var script = document.createElement('script');
        script.type = 'module';
        script.onerror = function() {
            var fallback = document.createElement('script');
            fallback.type = 'module';
            fallback.src = '{{ url_for("static", filename="dist/assets/main.js") }}';
            document.body.appendChild(fallback);
        };
        script.src = 'http://localhost:3000/main.jsx';
        document.body.appendChild(script);
    </script>
    {% else %}
    <script type="module" src="{{ url_for('static', filename='dist/assets/main.js') }}"></script>
    {% endif %}
</body>
</html>
