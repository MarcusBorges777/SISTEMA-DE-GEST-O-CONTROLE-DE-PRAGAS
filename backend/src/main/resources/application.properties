# Database Configuration - H2 (Em memória para facilitar)
spring.datasource.url=jdbc:h2:file:./database/documentos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (Acesso em http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway desabilitado (usando ddl-auto=update)
spring.flyway.enabled=false

# Server
server.port=8080
server.servlet.context-path=/api

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Templates Path
app.templates.path=modelos
app.output.path=output/documentos

# Logging
logging.level.com.dedetizadora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
